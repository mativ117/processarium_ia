<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f3eb">
  <meta name="description" content="Un atelier miniature pour comprendre les processus, suivre les rôles et voir les idées prendre forme.">
  <title>Processarium — Les idées prennent vie</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./src/style.css">
  <script type="module" src="./src/app.js"></script>
</head>
<body>
  <header class="app-header">
    <a class="brand" href="./" data-i18n-aria="home"><span class="brand-mark" aria-hidden="true">p.</span><span>processarium<span class="brand-sub" data-i18n="brandTagline">LES IDÉES PRENNENT VIE</span></span></a>
    <span class="demo-label"><span class="status-dot"></span><span data-i18n="demo">Démonstration interactive</span></span>
    <div class="language-controls" role="group" data-i18n-aria="languages"><button data-language="fr" aria-pressed="true" lang="fr">FR</button><button data-language="en" aria-pressed="false" lang="en">EN</button><button id="more-languages" data-i18n="moreLanguages">Autres langues</button></div>
    <button class="quiet" id="collection-toggle" aria-controls="collection-dialog"><span data-i18n="collection">Ma collection</span> <span id="collection-count">0</span></button>
  </header>
  <p class="automatic-warning" id="automatic-warning" role="status" hidden></p>
  <main data-details="false">
    <aside class="catalog" data-i18n-aria="guidesAvailable">
      <div class="eyebrow" data-i18n="explore">CHOISIR UN GUIDE</div><h1 data-i18n="headline">De l’idée au concret.</h1><p class="catalog-intro" data-i18n="intro"></p>
      <div class="level-tabs"><button data-level="0" aria-pressed="true"></button><button data-level="1" aria-pressed="false"></button><button data-level="2" aria-pressed="false"></button><button data-level="3" aria-pressed="false"></button></div>
      <label class="mobile-picker" for="guide-picker" data-i18n="guidePicker">Choisir un guide</label><select class="mobile-picker" id="guide-picker"></select>
      <div id="guide-list" class="guide-list"></div>
      <div class="catalog-foot"><span class="tiny-island" aria-hidden="true">◇</span><p data-i18n="catalogFoot"></p></div>
    </aside>
    <section id="animation-scene" class="workspace" data-i18n-aria="simulation">
      <div class="world-heading"><div><div class="eyebrow" id="level-label"></div><h2 id="guide-title"></h2></div><span class="number-tag" id="guide-size"></span><button id="fullscreen-toggle" aria-pressed="false"></button></div>
      <div class="level-context"><p id="level-description"></p><p id="prerequisites"></p></div>
      <div class="scene-story" aria-live="polite"><div class="story-heading"><span id="story-number"></span><span class="phase-pill" id="story-phase"></span></div><h3 id="story-title"></h3><p id="story-text"></p><p class="story-actors" id="story-actors"></p></div>
      <div class="transformation" aria-live="polite"><div><span data-i18n="inputLabel"></span><p id="scene-input"></p></div><span class="transformation-arrow" aria-hidden="true">→</span><div><span id="scene-output-label"></span><p id="scene-output"></p></div></div>
      <div class="world-shell">
        <div class="map-caption"><span class="live-dot"></span><span id="map-caption"></span></div>
        <canvas id="world" role="img" data-i18n-aria="canvasLabel"></canvas>
        <div class="map-controls" data-i18n-aria="mapControls"><button id="zoom-out" data-i18n-aria="zoomOut">−</button><button id="zoom-reset" data-i18n="center">Centrer</button><button id="zoom-in" data-i18n-aria="zoomIn">+</button></div>
        <div class="map-key"><span><i class="key-active"></i><span data-i18n="current"></span></span><span><i class="key-done"></i><span data-i18n="contributed"></span></span><span id="parallel-key"></span></div>
      </div>
      <div class="transport"><button class="play" id="play"><span id="play-symbol" aria-hidden="true">▶︎</span><span id="play-text">Lecture</span></button><button class="next" id="next"></button><div class="transport-state"><span id="step-status" aria-live="polite"></span><div class="track" id="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div id="progress"></div></div></div><label class="speed-control"><span data-i18n="speed">Vitesse</span><select id="speed"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><button class="quiet" id="replay" data-i18n="replay">Rejouer</button></div>
      <div class="scene-options"><button id="details-toggle" aria-expanded="false" aria-controls="process-details"></button><button id="correct" class="correction" hidden data-i18n="correct"></button></div>
      <div class="role-list" id="role-list" data-i18n-aria="rolesLabel"></div>
      <div id="resource-summary" class="resource-summary"></div><details id="resource-inventory"><summary data-i18n="inventoryTitle"></summary><p data-i18n="resourceDisclaimer"></p><div id="resource-roles"></div><div id="resource-tools"></div><dl id="resource-quantities"></dl><p id="resource-hardware"></p></details>
      <div class="selected-role" id="role-detail" aria-live="polite"></div>
      <div class="process-path" id="process-path" data-i18n-aria="stepsLabel"></div>
    </section>
    <aside id="process-details" class="inspector" data-i18n-aria="inspector">
      <div class="eyebrow" data-i18n="documentHeading"></div>
      <div class="document"><div class="document-top"><span class="paper-symbol" aria-hidden="true">≡</span><span id="document-label"></span></div><p id="document-content" aria-live="polite"></p></div>
      <div id="branch" class="branch" hidden><label for="pdf-type" data-i18n="pdfLabel"></label><select id="pdf-type"><option value="mixed" data-i18n="pdfMixed"></option><option value="text" data-i18n="pdfText"></option><option value="scan" data-i18n="pdfScan"></option></select></div>
      <div class="resource-heading"><h3 data-i18n="resourceHeading"></h3><span data-i18n="simulated"></span></div>
      <div class="workload-plan"><span class="eyebrow" data-i18n="scenarioPlan"></span><div><span data-i18n="peak"></span><strong id="peak-workers"></strong></div><div><span data-i18n="plannedWork"></span><strong id="planned-work"></strong></div></div>
      <dl class="metrics"><div><dt data-i18n="elapsed"></dt><dd id="elapsed"></dd></div><div><dt data-i18n="effort"></dt><dd id="effort"></dd></div><div><dt data-i18n="human"></dt><dd id="human"></dd></div></dl>
      <p class="resource-detail" id="resources"></p>
      <details class="glossary"><summary data-i18n="glossaryTitle"></summary><dl id="glossary"></dl></details>
      <div class="source-note"><span class="eyebrow" data-i18n="about"></span><p id="source-note"></p><a id="source-link" target="_blank" rel="noopener noreferrer" hidden data-i18n="sourceLink"></a></div>
    </aside>
  </main>
  <footer><span data-i18n="footer"></span><span data-i18n="footerNote"></span></footer>
  <dialog id="collection-dialog" aria-labelledby="collection-title"><div class="dialog-head"><div><div class="eyebrow" data-i18n="collectionEyebrow"></div><h2 id="collection-title" data-i18n="collectionTitle"></h2></div><button class="quiet" id="close-collection" data-i18n="close"></button></div><p id="collection-summary"></p><div id="collected-agents" class="collected-agents"></div><div class="collection-guides" id="collection-guides"></div><p class="storage-note" id="storage-note"></p></dialog>
  <dialog id="language-dialog" aria-labelledby="language-title"><div class="dialog-head"><h2 id="language-title" data-i18n="languageDialogTitle"></h2><button class="quiet" id="close-language" data-i18n="close"></button></div><p data-i18n="languageIntro"></p><form id="translation-form"><label for="translation-target" data-i18n="languageTarget"></label><input id="translation-target" list="language-suggestions" autocomplete="off" spellcheck="false" required maxlength="35" aria-describedby="translation-local"><datalist id="language-suggestions"><option value="es">Español</option><option value="de">Deutsch</option><option value="it">Italiano</option><option value="pt">Português</option><option value="nl">Nederlands</option><option value="ar">العربية</option><option value="ja">日本語</option><option value="zh">中文</option><option value="uk">Українська</option><option value="hi">हिन्दी</option></datalist><p id="translation-local" class="storage-note" data-i18n="translationLocal"></p><p id="translation-status" role="status" aria-live="polite"></p><div class="dialog-actions"><button type="submit" id="generate-language" class="next" data-i18n="generate"></button><button type="button" id="cancel-translation" class="quiet" data-i18n="cancel"></button></div></form></dialog>
</body>
</html>
